spring:
  application:
    name: fia-academico
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  port: ${PORT:8080}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    mode: ${APP_SECURITY_MODE:local}
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:8080}
  seed:
    enabled: ${IMPORTAR_FUENTES:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
