spring.datasource.url=jdbc:h2:mem:fia-demo;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
app.seed.enabled=true

app.agenda.generar=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./data/demo-load.sql
app.demo.sql-persistence=true
app.security.admin.password=${ADMIN_PASSWORD:AdminFia2026!}
