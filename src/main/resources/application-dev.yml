# Mismo servidor Oracle que BomERP Local; FIA usa su propio esquema FIA_APP.
spring:
  datasource:
    url: ${BOMERP_ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${FIA_ORACLE_USER:FIA_APP}
    password: ${FIA_ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  devtools:
    restart:
      enabled: true

logging:
  level:
    pe.edu.upeu.fia: DEBUG
